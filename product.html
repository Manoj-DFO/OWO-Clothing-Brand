
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | OWO</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="announcement">
        FREE SHIPPING ON ORDERS ABOVE ₹1999
    </div>

    <header class="product-header">

        <a href="index.html" class="product-logo">OWO.</a>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Continue Shopping
        </a>

        <a href="track-order.html" class="back-link">
            <i class="fa-solid fa-truck"></i>
            Track Order
        </a>

        <a href="login.html" class="back-link" id="accountLink">
            <i class="fa-regular fa-user"></i>
            Account
        </a>

        <a href="cart.html" class="cart-link">
            <i class="fa-solid fa-bag-shopping"></i>
            Cart
            <span id="cart-count">0</span>
        </a>

    </header>

    <main class="product-details-container">

        <div id="product-details">
            <p>Loading product details...</p>
        </div>

    </main>

    <footer class="product-footer">
        <h2>OWO.</h2>
        <p>Wear Your Identity.</p>
        <a href="track-order.html">Track Your Order</a>
        <p>© 2026 OWO. All rights reserved.</p>
    </footer>

    <!-- CUSTOMER ACCOUNT NAVIGATION -->
    <script>
        const accountLink = document.getElementById("accountLink");
        const customerToken = localStorage.getItem("owoCustomerToken");

        if (accountLink) {
            accountLink.href = customerToken
                ? "account.html"
                : "login.html";

            accountLink.innerHTML = customerToken
                ? '<i class="fa-regular fa-user"></i> My Account'
                : '<i class="fa-regular fa-user"></i> Account';
        }
    </script>

    <script src="product.js"></script>

</body>
</html>
