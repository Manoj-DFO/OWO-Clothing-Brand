
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OWO | Create Account</title>

    <link rel="stylesheet" href="register.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">OWO<span>.</span></a>

        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </header>

    <main class="register-container">

        <section class="register-image">
            <div class="image-content">
                <p>WELCOME TO OWO</p>

                <h1>
                    YOUR STYLE.<br>
                    YOUR IDENTITY.<br>
                    <span>YOUR OWO.</span>
                </h1>

                <p>Join the OWO community and express yourself through fashion.</p>
            </div>
        </section>

        <section class="register-form-section">

            <div class="register-form-container">

                <p class="eyebrow">JOIN THE OWO COMMUNITY</p>

                <h2>Create <span>Account.</span></h2>

                <p class="subtitle">
                    Create your account and discover your own style.
                </p>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="name">FULL NAME</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">EMAIL ADDRESS</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">PHONE NUMBER</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter 10-digit phone number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">PASSWORD</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                placeholder="Minimum 8 characters"
                                minlength="8"
                                maxlength="128"
                                required
                            >

                            <button type="button" id="togglePassword" aria-label="Show password">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">CONFIRM PASSWORD</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Re-enter your password"
                                required
                            >

                            <button type="button" id="toggleConfirmPassword" aria-label="Show confirm password">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <p id="message" class="message"></p>

                    <button type="submit" class="register-btn" id="registerButton">
                        CREATE ACCOUNT
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

                <div class="login-link">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </div>

                <div class="register-footer">
                    <a href="index.html">OWO</a>
                    <span>© 2026 OWO. ALL RIGHTS RESERVED.</span>
                </div>

            </div>

        </section>

    </main>

    <!-- CHECK CUSTOMER LOGIN STATUS -->

    <script>
        const customerToken = localStorage.getItem("owoCustomerToken");

        if (customerToken) {
            window.location.replace("account.html");
        }
    </script>

    <script src="register.js"></script>

</body>
</html>
